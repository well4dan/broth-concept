  <circle cx="500" cy="500" r="476" fill="none" stroke="#EBF0E8" stroke-width="10" />
  <circle cx="500" cy="500" r="426" fill="none" stroke="#EBF0E8" stroke-width="2.5" opacity="0.55" />

  
    <g fill="none" stroke="#EBF0E8" stroke-width="6.0" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10">
