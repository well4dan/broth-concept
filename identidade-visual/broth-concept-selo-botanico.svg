    <linearGradient id="leaf3" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3C4A31" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#1E271A" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <g clip-path="url(#circleClip)">
