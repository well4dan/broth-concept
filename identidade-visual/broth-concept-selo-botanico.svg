    <path d="M 880 240 Q 630 450 380 660" stroke="#161E14" stroke-width="3" fill="none" opacity="0.5" />
    <path d="M -20 640 C 180 500, 440 560, 560 820 C 320 940, 80 860, -20 640 Z" fill="url(#leaf3)" opacity="0.7" />
    <path d="M 420 680 C 640 580, 880 660, 980 900 C 740 1020, 520 920, 420 680 Z" fill="url(#leaf2)" opacity="0.85" />
    <circle cx="500" cy="500" r="476" fill="none" stroke="#0E140D" stroke-width="45" opacity="0.45" />
