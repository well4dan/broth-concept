<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Broth Concept - Selo Botânico Oficial">
  <title>Broth Concept - Logo Oficial</title>
  <defs>
    <clipPath id="circleClip">
      <circle cx="500" cy="500" r="476" />
    </clipPath>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#273320" />
      <stop offset="60%" stop-color="#1E281A" />
      <stop offset="100%" stop-color="#131A11" />
